name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

# one release at a time; never cancel a release that is already publishing
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: [self-hosted, windows, delphi]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether this VERSION was already released
        id: version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $version = (Get-Content -Path VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::error::VERSION '$version' is not semver (MAJOR.MINOR.PATCH)."
            exit 1
          }
          git fetch --tags --force 2>&1 | Out-Null
          $existing = git tag -l "v$version"
          if ($existing) {
            Write-Host "::notice::v$version already exists - nothing to release (bump VERSION to publish)."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build executables and run unit tests
        if: steps.version.outputs.skip == 'false'
        shell: cmd
        run: build.bat --tests

      - name: Package and publish GitHub Release
        if: steps.version.outputs.skip == 'false'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # native tools (git, gh) write progress to stderr: never let that become a
          # PowerShell error; check $LASTEXITCODE explicitly instead
          $ErrorActionPreference = 'Continue'
          $tag = "v$env:VERSION"

          $zipName = "DelphiBackupRestore-$tag.zip"
          Compress-Archive -Path bin\DelphiBackupRestore.exe, bin\DelphiBackupRestoreCli.exe, README.md, LICENSE -DestinationPath $zipName -Force
          if (-not (Test-Path $zipName)) { Write-Host "::error::zip not created"; exit 1 }

          $lines = foreach ($f in @($zipName, 'bin\DelphiBackupRestore.exe', 'bin\DelphiBackupRestoreCli.exe')) {
            "{0}  {1}" -f (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf)
          }
          $lines | Set-Content -Path SHA256SUMS -Encoding ascii

          $prevTag = git tag -l "v*" --sort=-v:refname | Select-Object -First 1
          if ($prevTag) {
            git log --no-merges --pretty="- %s" "$prevTag..HEAD" | Out-File -FilePath notes.md -Encoding utf8
          } else {
            git log --no-merges --pretty="- %s" | Out-File -FilePath notes.md -Encoding utf8
          }

          # gh creates the tag on this commit together with the release, so a failed
          # run can simply be re-run (no tag is left behind without a release)
          gh release create $tag $zipName SHA256SUMS --target $env:GITHUB_SHA --title $tag --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::gh release create failed ($LASTEXITCODE)"; exit 1 }
          Write-Host "Released $tag"
